services:
  arviro:
    image: ods/arviro:0.1.0-local-v1
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ARVIRO_REF: ${ARVIRO_REF:-main}
    container_name: ods-arviro
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - "127.0.0.1:${ARVIRO_PORT:-11104}:8765"
    environment:
      ARVIRO_PORT: ${ARVIRO_PORT:-11104}
      ARVIRO_AUTH_TOKEN: ${ARVIRO_AUTH_TOKEN:?Set the token for the admin page and /mcp}
      ARVIRO_EMBEDDING_PROVIDER: ${ARVIRO_EMBEDDING_PROVIDER:-none}
      ARVIRO_OLLAMA_URL: ${ARVIRO_OLLAMA_URL:-http://ollama:11434}
    volumes:
    # Configuration, index, library.json and the library itself (library/documents, library/zim, library/maps).
    - ./data/arviro:/data
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8765/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 1000:1000
    init: true
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
networks:
  ods-network:
    external: true
    name: ods-network
